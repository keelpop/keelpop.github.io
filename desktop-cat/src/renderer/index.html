<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Desktop Cat</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      /* The window ignores mouse events anyway; this is belt and braces. */
      pointer-events: none;
      user-select: none;
      cursor: default;
    }
    #cat {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: fixed;
      left: 8px;
      top: 8px;
      font: 11px/1.45 ui-monospace, monospace;
      color: #b8f5c0;
      background: rgba(8, 10, 14, 0.72);
      padding: 6px 9px;
      border-radius: 5px;
      white-space: pre;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="cat"></canvas>
  <div id="hud"></div>
  <script src="rig.js"></script>
  <script src="draw.js"></script>
  <script src="brain.js"></script>
  <script src="app.js"></script>
</body>
</html>
