name: nightly

# 毎日 06:00 JST。取りこぼしを拾うだけの掃除係。
# autoflow が何らかの理由で動かなかったブランチ、PR になっていないブランチ、
# 長く止まっている PR を見つける。ここで作業内容の判断はしない。
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PR になっていない claude/* ブランチを拾う
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for b in $(git branch -r --list 'origin/claude/*' --format='%(refname:lstrip=3)'); do
            [ "$(git rev-list --count "origin/main..origin/$b")" = "0" ] && continue
            [ -n "$(gh pr list --head "$b" --state open --json number -q '.[].number')" ] && continue
            BODY=$(printf '夜間の掃除が見つけた、PR になっていないブランチです。\n\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
                   "$(git log --format='- %s' "origin/main..origin/$b")")
            gh pr create --base main --head "$b" --title "[nightly] $b" --body "$BODY" || true
          done

      - name: 7日以上動きのない PR に印を付ける
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,updatedAt \
            --jq '.[] | select((now - (.updatedAt|fromdate)) > 604800) | .number' \
          | while read -r n; do
              gh pr edit "$n" --add-label stale || true
            done

      - name: 現況を STATUS.md として main に残す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# STATUS （nightly が自動生成。手で編集しない）"
            echo
            echo "更新: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "## 開いている PR"
            gh pr list --state open --json number,title,labels \
              --jq '.[] | "- #\(.number) \(.title) \(.labels | map(.name) | join(" "))"' \
              || echo "(なし)"
            echo
            echo "## サイト検査"
            python3 tools/check_site.py 2>&1 | tail -5
          } > STATUS.md
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git diff --cached --quiet || {
            git commit -m "auto: STATUS.md を更新"
            git push origin HEAD:main
          }
