name: nightly

# 毎日 06:00 JST。取りこぼしを拾うだけの掃除係。
# autoflow が何らかの理由で動かなかったブランチ、PR になっていないブランチ、
# 長く止まっている PR を見つける。ここで作業内容の判断はしない。
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# autoflow と同じグループ。両方が同時に main へ push すると
# 片方が non-fast-forward で落ちる。順番に走らせて衝突自体を起こさない。
concurrency:
  group: autoflow-main
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 無いと check_site のワークフロー検査が簡易版に落ち、
      # STATUS.md に「検証できていない」警告が毎晩載ることになる。
      - name: pyyaml
        run: pip install --quiet pyyaml

      # 保留を知らせた Issue は、そのブランチが片付いても誰も閉じない。
      # 実際に2件、マージ済みのブランチの Issue が開いたまま残った。
      # 開いている Issue が「手が要るもの」の一覧である以上、
      # 済んだものが混ざると一覧そのものが信用されなくなる。
      - name: 片付いたブランチの Issue を閉じる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --json number,title \
            --jq '.[] | select(.title | startswith("手動で確認してほしい: ")) | "\(.number)\t\(.title)"' \
          | while IFS=$'\t' read -r n title; do
              b=${title#手動で確認してほしい: }
              git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1 && continue
              MSG=$(printf 'ブランチ `%s` はもう存在しません（マージ済みか削除済み）。夜間の掃除が閉じました。\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$b")
              gh issue close "$n" --reason completed --comment "$MSG"
            done

      - name: 取りこぼしたブランチを拾って、通せるものは通す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for b in $(git branch -r --list 'origin/claude/*' --format='%(refname:lstrip=3)'); do
            # 毎回きれいな main から始める。前のブランチで失敗したマージが
            # ローカルに残ったまま次を積むと、検査されていない複数のマージが
            # まとめて公開される事故になる。
            git checkout -q main && git reset -q --hard origin/main
            if [ "$(git rev-list --count "origin/main..origin/$b")" = "0" ]; then
              # main に完全に取り込まれている。消しても何も失われない。
              # ここを continue で飛ばしていると、済んだブランチが一覧に残り続け、
              # 「未マージがどれか」が読めなくなる。放置の温床になるので掃除する。
              echo "取り込み済みなので削除: $b"
              git push origin --delete "$b" || true
              continue
            fi
            MERGED=$(git rev-parse "origin/$b")

            git checkout -q -B sweep "$MERGED"
            if ! python3 tools/check_site.py --site >/dev/null 2>&1 ||
               ! python3 tools/automerge_gate.py | grep -q '^safe=true'; then
              echo "保留: $b"
              continue
            fi

            git checkout -q main
            if ! git merge --no-ff "$MERGED" -m "Merge $b (nightly sweep)"; then
              git merge --abort || true
              echo "マージできず: $b"
              continue
            fi
            # autoflow と同じく、合わせたあとにもう一度検査する。
            if ! python3 tools/check_site.py --site; then
              git reset -q --hard origin/main
              echo "マージ後の検査に落ちた: $b"
              continue
            fi
            if ! git push origin main; then
              git reset -q --hard origin/main
              echo "push できず: $b"
              continue
            fi
            git fetch -q origin "$b"
            if [ "$(git rev-parse FETCH_HEAD)" = "$MERGED" ]; then
              git push origin --delete "$b"
            fi
          done
          git checkout -q main && git reset -q --hard origin/main

      # 週次の棚卸しはリポジトリの外（Claude の Routine）で動いているので、
      # 止まってもリポジトリからは分からない。NOW.md が長く動いていないことを
      # 死活監視の代わりにする。仕組みが静かに死ぬのを防ぐ最後の見張り。
      - name: 週次メンテナンスが止まっていないか
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(git log -1 --format=%ct -- .claude/state/NOW.md || echo 0)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "NOW.md の最終更新: ${AGE}日前"
          [ "$AGE" -lt 21 ] && exit 0
          TITLE="週次メンテナンスが止まっている可能性があります"
          [ -n "$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')" ] && exit 0
          BODY=$(printf '`.claude/state/NOW.md` が %d 日更新されていません。\n\n毎週月曜に走るはずの自動メンテナンスが止まっている可能性があります。\nclaude.ai の Routine 設定を確認してください。\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$AGE")
          gh issue create --title "$TITLE" --body "$BODY"

      - name: 現況を STATUS.md として main に残す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# STATUS （nightly が自動生成。手で編集しない）"
            echo
            echo "更新: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "## 手が要るもの（開いている Issue）"
            gh issue list --state open --json number,title \
              --jq '.[] | "- #\(.number) \(.title)"' || echo "(なし)"
            echo
            echo "## マージされていないブランチ"
            for b in $(git branch -r --list 'origin/claude/*' --format='%(refname:lstrip=3)'); do
              n=$(git rev-list --count "origin/main..origin/$b")
              [ "$n" = "0" ] || echo "- $b (+${n}コミット, 最終: $(git log -1 --format=%cr "origin/$b"))"
            done
            echo
            echo "## サイト検査"
            python3 tools/check_site.py 2>&1 | tail -5
          } > STATUS.md
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git diff --cached --quiet || {
            git commit -m "auto: STATUS.md を更新"
            git push origin HEAD:main
          }
