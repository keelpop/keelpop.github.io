name: nightly

# 毎日 06:00 JST。取りこぼしを拾うだけの掃除係。
# autoflow が何らかの理由で動かなかったブランチ、PR になっていないブランチ、
# 長く止まっている PR を見つける。ここで作業内容の判断はしない。
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 取りこぼしたブランチを拾って、通せるものは通す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for b in $(git branch -r --list 'origin/claude/*' --format='%(refname:lstrip=3)'); do
            [ "$(git rev-list --count "origin/main..origin/$b")" = "0" ] && continue
            git checkout -q -B "sweep-$$" "origin/$b"
            if python3 tools/check_site.py >/dev/null 2>&1 &&
               python3 tools/automerge_gate.py | grep -q '^safe=true'; then
              git checkout -q main
              git merge --no-ff "origin/$b" -m "Merge $b (nightly sweep)" &&
                git push origin main && git push origin --delete "$b" || git merge --abort || true
            else
              echo "保留: $b"
            fi
            git checkout -q main
          done

      - name: 現況を STATUS.md として main に残す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# STATUS （nightly が自動生成。手で編集しない）"
            echo
            echo "更新: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "## 手が要るもの（開いている Issue）"
            gh issue list --state open --json number,title \
              --jq '.[] | "- #\(.number) \(.title)"' || echo "(なし)"
            echo
            echo "## マージされていないブランチ"
            for b in $(git branch -r --list 'origin/claude/*' --format='%(refname:lstrip=3)'); do
              n=$(git rev-list --count "origin/main..origin/$b")
              [ "$n" = "0" ] || echo "- $b (+${n}コミット, 最終: $(git log -1 --format=%cr "origin/$b"))"
            done
            echo
            echo "## サイト検査"
            python3 tools/check_site.py 2>&1 | tail -5
          } > STATUS.md
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git diff --cached --quiet || {
            git commit -m "auto: STATUS.md を更新"
            git push origin HEAD:main
          }
