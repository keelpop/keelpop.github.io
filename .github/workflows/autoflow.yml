name: autoflow

# claude/* に push されたら、安全条件を満たすものを main へ直接マージする。
# 5ヶ月放置されたブランチが4本あったことへの直接の対策。
#
# PR を作らないのは意図的。GitHub Actions が PR を作るには
# 「Allow GitHub Actions to create and approve pull requests」を
# 設定画面で有効にする必要があり、人手が要るため（実際にこれで一度落ちた）。
# 判断が必要なブランチは Issue で知らせる。Issue の作成に追加設定は要らない。
on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: autoflow-main
  cancel-in-progress: false

jobs:
  autoflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --site だけを門にする。ルール帳簿（NOW.md の行数、ルールの賞味期限など）の
      # 不備で公開経路を止めない。両方を同じ exit code に載せると、NOW.md が
      # 1行はみ出しただけで全ブランチがマージ不能になり、それを直すブランチ自身も
      # マージできなくなって手詰まりになる。帳簿の検査は site-check.yml が行う。
      - name: サイトの検査
        run: python3 tools/check_site.py --site

      - name: 自動マージしてよいか判定
        id: gate
        run: python3 tools/automerge_gate.py >> "$GITHUB_OUTPUT"

      - name: 安全なら main へマージして公開する
        if: steps.gate.outputs.safe == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # マージ対象を先に固定しておく。後で「この時点の内容を確かに取り込んだ」
          # ことを確かめてからでないとブランチを消せない。
          MERGED=$(git rev-parse "origin/$BRANCH")
          git checkout main
          git merge --no-ff "$MERGED" -m "Merge $BRANCH" -m "$REASON"
          # 個々には通っても、合わせると壊れることがある（title の重複など）。
          python3 tools/check_site.py --site
          git push origin main
          # 削除する前に、fetch 後に新しい push が来ていないか確かめる。
          # 確かめないと、2回目の push を取り込まないままブランチごと消して
          # 作業を失う（一度やっている: INC-0010）。
          git fetch -q origin "$BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" = "$MERGED" ]; then
            git push origin --delete "$BRANCH"
          else
            echo "新しい push が来ているのでブランチは残します。次回の autoflow が拾います。"
          fi

      - name: 判断が要るなら Issue で知らせる
        if: steps.gate.outputs.safe != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          TITLE="手動で確認してほしい: $BRANCH"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            # 既に立っているなら黙る。push のたびにコメントすると、
            # 作業中のブランチひとつで通知が何十件も出る。
            echo "Issue #$EXISTING で既に知らせているので何もしません"
            exit 0
          fi
          BODY=$(printf 'ブランチ `%s` は自動マージの条件を満たしませんでした。\n\n**理由: %s**\n\n保留は失敗ではありません。設定や保護機構に触れる変更は、必ず人が一度見る設計です。\n\n内容を見て問題なければ、GitHub の画面でこのブランチを main にマージしてください。\n\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
                 "$BRANCH" "$REASON" \
                 "$(git log --format='- %s' "origin/main..origin/$BRANCH" | head -20)")
          gh issue create --title "$TITLE" --body "$BODY"

      # 上のどれかが落ちたときに何も起きないと、赤い × が残るだけで持ち主は気付かない。
      # 「静かに壊れる」のがこの仕組みで一番避けたい失敗の仕方。
      - name: 途中で落ちたことを知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="自動処理が失敗しました: $BRANCH"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number -q '.[0].number')
          [ -n "$EXISTING" ] && exit 0
          BODY=$(printf 'ブランチ `%s` の自動処理が途中で失敗しました。作業は消えていません（ブランチはそのまま残っています）。\n\n実行ログ: %s\n\n検査に落ちたか、main への push が競合した可能性があります。\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
                 "$BRANCH" "$RUN_URL")
          gh issue create --title "$TITLE" --body "$BODY"
