name: autoflow

# claude/* に push されたら、安全条件を満たすものを main へ直接マージする。
# 5ヶ月放置されたブランチが4本あったことへの直接の対策。
#
# PR を作らないのは意図的。GitHub Actions が PR を作るには
# 「Allow GitHub Actions to create and approve pull requests」を
# 設定画面で有効にする必要があり、人手が要るため（実際にこれで一度落ちた）。
# 判断が必要なブランチは Issue で知らせる。Issue の作成に追加設定は要らない。
on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: autoflow-main
  cancel-in-progress: false

jobs:
  autoflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 検査
        run: python3 tools/check_site.py

      - name: 自動マージしてよいか判定
        id: gate
        run: python3 tools/automerge_gate.py >> "$GITHUB_OUTPUT"

      - name: 安全なら main へマージして公開する
        if: steps.gate.outputs.safe == 'true'
        run: |
          B='${{ github.ref_name }}'
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout main
          git merge --no-ff "origin/$B" \
            -m "Merge $B" -m '${{ steps.gate.outputs.reason }}'
          python3 tools/check_site.py
          git push origin main
          git push origin --delete "$B"

      - name: 判断が要るなら Issue で知らせる
        if: steps.gate.outputs.safe != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B='${{ github.ref_name }}'
          TITLE="手動で確認してほしい: $B"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number -q '.[0].number')
          BODY=$(printf 'ブランチ `%s` は自動マージの条件を満たしませんでした。\n\n**理由: %s**\n\n保留は失敗ではありません。設定や保護機構に触れる変更は、必ず人が一度見る設計です。\n\n内容を見て問題なければ、GitHub の画面でこのブランチを main にマージしてください。\n\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
                 "$B" '${{ steps.gate.outputs.reason }}' \
                 "$(git log --format='- %s' "origin/main..origin/$B" | head -20)")
          if [ -n "$EXISTING" ]; then
            # 既に立っているなら黙る。push のたびにコメントすると、
            # 作業中のブランチひとつで通知が何十件も出る。
            echo "Issue #$EXISTING で既に知らせているので何もしません"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label needs-human || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi
