name: autoflow

# claude/* に push されたら PR を作り、安全条件を満たすなら自動マージする。
# 5ヶ月放置されたブランチが4本あったことへの直接の対策。
# 人が「マージしていいか」を判断しなくても、退屈な変更は勝手に公開まで進む。
on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  autoflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 検査
        id: check
        run: python3 tools/check_site.py

      - name: PR が無ければ作る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B='${{ github.ref_name }}'
          if [ -z "$(gh pr list --head "$B" --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$B" \
              --title "$(git log -1 --format=%s)" \
              --body "$(git log --format='- %s' origin/main..HEAD)

---
_Generated by [Claude Code](https://claude.ai/code)_"
          fi

      - name: 自動マージしてよいか判定
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/automerge_gate.py >> "$GITHUB_OUTPUT"

      - name: 安全ならマージ、そうでなければ理由を残す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B='${{ github.ref_name }}'
          if [ "${{ steps.gate.outputs.safe }}" = "true" ]; then
            gh pr merge "$B" --squash --delete-branch --auto
          else
            gh pr edit "$B" --add-label needs-human || true
            gh pr comment "$B" --body "自動マージを保留しました。

理由: ${{ steps.gate.outputs.reason }}

保留は失敗ではありません。この種の変更は人が一度見る設計です。

---
_Generated by [Claude Code](https://claude.ai/code)_"
          fi
